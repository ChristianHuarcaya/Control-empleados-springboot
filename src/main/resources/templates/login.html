<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" />
    <!-- FontAwesome -->
    <link th:href="@{/plugins/fontawesome-free/css/all.min.css}" rel="stylesheet" />

    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-logo {
            width: 100px;
            margin-bottom: 1.5rem;
            object-fit: contain;
        }

        .form-control {
            padding-left: 2.75rem;
            font-size: 1rem;
            height: 45px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 1.2rem;
            pointer-events: none;
        }

        .btn-login {
            width: 100%;
            font-size: 1.1rem;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .forgot-password {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .forgot-password a {
            color: #007bff;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Mensajes de error/éxito */
        .alert {
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        
        <h3 class="mb-4">Iniciar Sesión</h3>

        <form th:action="@{/login}" method="post">
            <div class="mb-3 input-icon">
                <i class="fas fa-envelope"></i>
                <input type="text" id="username" name="username" class="form-control" placeholder="Correo electrónico" required />
            </div>

            <div class="mb-3 input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required />
            </div>

            <!-- Mensajes -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i> Has cerrado sesión correctamente.
            </div>

            <button type="submit" class="btn btn-primary btn-login">Iniciar Sesión</button>

            <div class="forgot-password">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
