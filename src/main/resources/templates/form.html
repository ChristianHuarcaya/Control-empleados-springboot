<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<title th:text="${titulo}">Formulario Empleado</title>
<!-- Asegúrate de incluir Bootstrap CSS y FontAwesome en tu layout -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<section layout:fragment="content">
		<div class="container mt-5">
			<h2 th:text="${titulo}" class="mb-4 text-center text-primary fw-bold"></h2>

			<!-- Mensajes flash -->
			<div th:if="${success}"
				class="alert alert-success alert-dismissible fade show text-center shadow-sm"
				role="alert" th:text="${success}">
				<button type="button" class="btn-close" data-bs-dismiss="alert"
					aria-label="Cerrar"></button>
			</div>
			<div th:if="${error}"
				class="alert alert-danger alert-dismissible fade show text-center shadow-sm"
				role="alert" th:text="${error}">
				<button type="button" class="btn-close" data-bs-dismiss="alert"
					aria-label="Cerrar"></button>
			</div>

			<!-- Formulario -->
			<form th:action="@{/form}" th:object="${empleado}" method="post"
				class="border rounded p-5 shadow-sm bg-white mx-auto"
				style="max-width: 800px;">
				<input type="hidden" th:field="*{id}" />

				<div class="row g-4">
					<div class="col-md-6">
						<label for="nombre" class="form-label fw-semibold">Nombre:</label>
						<input type="text" id="nombre" th:field="*{nombre}"
							class="form-control form-control-lg" placeholder="Ingrese nombre"
							required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
					</div>
					<div class="col-md-6">
						<label for="apellido" class="form-label fw-semibold">Apellido:</label>
						<input type="text" id="apellido" th:field="*{apellido}"
							class="form-control form-control-lg"
							placeholder="Ingrese apellido" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
					</div>
					<div class="col-md-6">
						<label for="email" class="form-label fw-semibold">Email:</label> <input
							type="email" id="email" th:field="*{email}"
							class="form-control form-control-lg"
							placeholder="ejemplo@correo.com" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
					</div>
					<div class="col-md-6">
						<label for="telefono" class="form-label fw-semibold">Teléfono:</label>
						<input type="tel" id="telefono" th:field="*{telefono}"
							class="form-control form-control-lg"
							placeholder="Número telefónico" pattern="[0-9]{7,15}" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
					</div>
					<div class="col-md-6">
						<label for="sexo" class="form-label fw-semibold">Sexo:</label> <select
							id="sexo" th:field="*{sexo}" class="form-select form-select-lg"
							required>
							<option value="" disabled selected>Seleccione...</option>
							<option value="Masculino"
								th:selected="${empleado.sexo == 'Masculino'}">Masculino</option>
							<option value="Femenino"
								th:selected="${empleado.sexo == 'Femenino'}">Femenino</option>
						</select>
						<div class="text-danger mt-1" th:if="${#fields.hasErrors('sexo')}"
							th:errors="*{sexo}"></div>
					</div>
					<div class="col-md-6">
						<label for="salario" class="form-label fw-semibold">Salario:</label>
						<input type="number" id="salario" step="0.01" min="0"
							th:field="*{salario}" class="form-control form-control-lg"
							placeholder="0.00" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('salario')}" th:errors="*{salario}"></div>
					</div>
					<div class="col-md-6">
						<label for="fecha" class="form-label fw-semibold">Fecha de
							Ingreso:</label> <input type="date" id="fecha" th:field="*{fecha}"
							class="form-control form-control-lg" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
					</div>
					<div class="col-md-6">
						<label for="puesto" class="form-label fw-semibold">Puesto:</label>
						<input type="text" id="puesto" th:field="*{puesto}"
							class="form-control form-control-lg"
							placeholder="Ingrese el puesto" required />
						<div class="text-danger mt-1"
							th:if="${#fields.hasErrors('puesto')}" th:errors="*{puesto}"></div>
					</div>
				</div>

				<div class="d-flex justify-content-between mt-4">
					<!-- Botón para volver a la lista de empleados -->
					<a th:href="@{/lista}"
						class="btn btn-outline-secondary btn-lg shadow-sm"> <i
						class="fas fa-arrow-left me-2"></i> Volver
					</a>

					<!-- Nuevo botón para ir al Dashboard -->
					<a th:href="@{/dashboard}" class="btn btn-success btn-lg shadow-sm">
						<i class="fas fa-tachometer-alt me-2"></i> Ir al Dashboard
					</a>

					<!-- Botón de registrar o actualizar -->
					<button type="submit" class="btn btn-primary btn-lg shadow-sm"
						th:text="${empleado.id != null} ? 'Actualizar' : 'Registrar'">
						<i class="fas fa-save me-2"></i> Registrar
					</button>
				</div>

			</form>
		</div>
	</section>

	<!-- Bootstrap JS (en tu layout) -->
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
