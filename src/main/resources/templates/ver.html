<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Detalles del Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4" th:text="${titulo}">Detalles del Empleado</h2>

    <div class="card">
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${empleado.id}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${empleado.nombre}"></span></p>
            <p><strong>Apellido:</strong> <span th:text="${empleado.apellido}"></span></p>
            <p><strong>Email:</strong> <span th:text="${empleado.email}"></span></p>
            <p><strong>Teléfono:</strong> <span th:text="${empleado.telefono}"></span></p>
            <p><strong>Sexo:</strong> <span th:text="${empleado.sexo}"></span></p>
            <p><strong>Salario:</strong> S/. <span th:text="${empleado.salario}"></span></p>
            <p><strong>Puesto:</strong> <span th:text="${empleado.puesto}"></span></p>
            <p><strong>Fecha de Registro:</strong> <span th:text="${#dates.format(empleado.fecha, 'dd/MM/yyyy')}"></span></p>
        </div>
    </div>

    <div class="mt-4">
        <a href="/lista" class="btn btn-secondary">← Volver al listado</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
