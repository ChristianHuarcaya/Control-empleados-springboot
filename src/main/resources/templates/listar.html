<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<title>Listado de Empleados</title>
<!-- Asegúrate de tener Bootstrap y FontAwesome -->
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
	rel="stylesheet">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<section layout:fragment="content">

		<div class="container mt-5">
			<!-- En la vista de listar empleados -->
			<a th:href="@{/dashboard}"
				class="btn btn-success btn-lg shadow-sm mb-4"> <i
				class="fas fa-tachometer-alt me-2"></i> Ir al Dashboard
			</a>

			<form th:action="@{/lista}" method="get" class="d-flex w-100">
				<!-- Campo para buscar por nombre o puesto -->
				<input type="text" name="query" class="form-control me-2"
					placeholder="Buscar por nombre o puesto" />
				<button type="submit" class="btn btn-primary">Buscar</button>
			</form>


			<!-- Encabezado y acciones -->
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h2 class="text-primary fw-bold">Listado de Empleados</h2>
				<div>
					<a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
						th:href="@{/form}" class="btn btn-success me-2 shadow-sm"> <i
						class="fas fa-user-plus me-1"></i> Agregar Empleado
					</a> <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
						th:href="@{/exportarPDF}"
						class="btn btn-outline-danger me-2 shadow-sm"> <i
						class="fas fa-file-pdf me-1"></i> Exportar a PDF
					</a> <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
						th:href="@{/exportarExcel}"
						class="btn btn-outline-success shadow-sm"> <i
						class="fas fa-file-excel me-1"></i> Exportar a Excel
					</a>
				</div>
			</div>

			<!-- Mensaje de éxito -->
			<div th:if="${mensaje}"
				class="alert alert-success alert-dismissible fade show shadow-sm"
				role="alert">
				<i class="fas fa-check-circle me-2"></i> <span th:text="${mensaje}"></span>
				<button type="button" class="btn-close" data-bs-dismiss="alert"
					aria-label="Cerrar"></button>
			</div>


			<!-- Tabla de empleados -->
			<div class="table-responsive shadow rounded">
				<table
					class="table table-hover align-middle text-center bg-white rounded mb-0">
					<thead class="table-primary text-uppercase">
						<tr>
							<th scope="col">ID</th>
							<th scope="col">Nombre</th>
							<th scope="col">Apellido</th>
							<th scope="col">Email</th>
							<th scope="col">Teléfono</th>
							<th scope="col">Sexo</th>
							<th scope="col">Salario</th>
							<th scope="col">Fecha</th>
							<th scope="col">Puesto</th>
							<!-- Columna puesto -->
							<th scope="col">Detalles</th>
							<th th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
								scope="col">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="empleado : ${empleados}" class="align-middle">
							<td th:text="${empleado.id}"></td>
							<td th:text="${empleado.nombre}"></td>
							<td th:text="${empleado.apellido}"></td>
							<td><a th:href="'mailto:' + ${empleado.email}"
								th:text="${empleado.email}" class="text-decoration-none"></a></td>
							<td th:text="${empleado.telefono}"></td>
							<td th:text="${empleado.sexo}"></td>
							<td
								th:text="${#numbers.formatDecimal(empleado.salario, 1, 'COMMA', 2, 'POINT')} + ' $'"></td>
							<td th:text="${#dates.format(empleado.fecha, 'dd/MM/yyyy')}"></td>
							<td th:text="${empleado.puesto}"></td>
							<!-- Aquí se muestra el puesto -->
							<td><a th:href="@{'/ver/' + ${empleado.id}}"
								class="btn btn-sm btn-info shadow-sm" title="Ver detalles">
									<i class="fas fa-eye"></i>
							</a></td>
							<td th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
								<div class="btn-group" role="group">
									<!-- Botón Editar -->
									<a th:href="@{'/form/' + ${empleado.id}}"
										class="btn btn-sm btn-warning shadow-sm me-1" title="Editar">
										<i class="fas fa-edit"></i>
									</a>


									<!-- Botón Eliminar -->
									<a th:href="@{'/eliminar/' + ${empleado.id}}"
										onclick=" confirm('¿Estás seguro de eliminar este empleado?');"
										class="btn btn-sm btn-danger shadow-sm" title="Eliminar">
										<i class="fas fa-trash-alt"></i>
									</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

			<!-- Paginación -->
			<div
				th:replace="fragments/paginator-nav :: paginador('/lista', ${page})"
				class="mt-4"></div>
		</div>

	</section>

	<!-- Bootstrap JS bundle -->
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
