<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Admin</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet" />
<!-- Bootstrap Icons -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
	rel="stylesheet" />

<style>
body {
	background-color: #f8f9fa;
}

.sidebar {
	height: 100vh;
	background-color: #343a40;
	color: white;
}

.sidebar a {
	color: #adb5bd;
	text-decoration: none;
	display: block;
	padding: 12px 20px;
}

.sidebar a:hover {
	background-color: #495057;
	color: white;
}

.sidebar .logout-btn {
	border: none;
	background: none;
	color: #adb5bd;
	text-align: left;
	width: 100%;
	padding: 12px 20px;
}

.sidebar .logout-btn:hover {
	background-color: #dc3545;
	color: white;
}
</style>
</head>
<body>

	<nav class="navbar navbar-dark bg-dark px-3">
		<a class="navbar-brand" href="#">Admin</a> <a class="navbar-brand"
			href="#">Bienvenido</a>
		<!-- Formulario de búsqueda -->
		<div class="d-flex mb-4">
			<form th:action="@{/lista}" method="get" class="d-flex w-100">
				<!-- Campo para buscar por nombre o puesto -->
				<input type="text" name="query" class="form-control me-2"
					placeholder="Buscar por nombre o puesto" />
				<button type="submit" class="btn btn-primary">Buscar</button>
			</form>
		</div>

	</nav>

	<div class="container-fluid">
		<div class="row">
			<!-- Sidebar -->
			<nav class="col-md-2 d-none d-md-block sidebar pt-3">
				<a href="/dashboard"><i class="bi bi-speedometer2"></i>
					Dashboard</a> <a href="/lista"><i class="bi bi-people"></i>
					Empleados</a> 
				<form action="/logout" method="post" th:action="@{/logout}">
					<input type="hidden" th:name="${_csrf.parameterName}"
						th:value="${_csrf.token}" />
					<button type="submit">Cerrar Sesion</button>
				</form>

			</nav>

			<!-- Contenido principal -->
			<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
				<h1 class="h2 mb-4">Panel de Control</h1>

				<div class="row g-4">
					<div class="col-sm-6 col-lg-3">
						<div class="card text-white bg-primary h-100">
							<div class="card-body">
								<h5 class="card-title">Empleados</h5>
								<p class="card-text fs-2" th:text="${totalEmpleados}">128</p>
							</div>
							<div class="card-footer">
								<a href="/lista" class="text-white text-decoration-none">Ver
									detalles</a>
							</div>
						</div>
					
				</div>

				<section class="mt-5">
					<h2>Resumen de actividad</h2>
					<p></p>
				</section>
			</main>
		</div>
	</div>

	<!-- Bootstrap JS Bundle -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
